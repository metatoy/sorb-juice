name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # no `cache: npm` — sorb-juice has no committed lockfile (polyrepo),
          # and setup-node's npm cache errors without one.
      - run: npm install
      - run: node --test
      - run: node build.mjs
